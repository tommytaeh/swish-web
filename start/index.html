<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swish 시작하기</title>
<meta name="description" content="swish 앱 설치 안내 — iPhone 은 App Store, Android 는 테스터 참여 후 Play 스토어에서 설치해요.">
<meta property="og:title" content="swish 시작하기">
<meta property="og:description" content="1분이면 설치해요. 오늘 뛴 농구를 기록하고, 코트를 찾고, 같이 뛸 사람을 모아요.">
<meta property="og:image" content="https://swish.co.kr/assets/feed-og.png">
<meta name="theme-color" content="#0A0B0F">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--court:#0A0B0F;--surface:#14161C;--line:#232734;--ink:#F2F4F8;--dim:#8A90A2;--scarlet:#FF3D2E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--court);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:2px solid var(--scarlet);outline-offset:3px;border-radius:8px}
  main{max-width:480px;margin:0 auto;padding:32px 16px 48px}
  .wordmark{font-weight:900;font-size:26px;letter-spacing:-.055em;color:var(--scarlet);font-style:italic}
  h1{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.3;margin:20px 0 6px}
  .sub{color:var(--dim);font-size:15.5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:20px}
  .card h2{font-size:18px;font-weight:800;margin-bottom:14px}
  .step{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
  .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--scarlet);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:10px}
  .step-body{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border-radius:14px;font-weight:800;font-size:16px;background:var(--scarlet);color:#fff;text-align:center}
  .btn.ghost{background:transparent;border:1.5px solid var(--line)}
  .hint{color:var(--dim);font-size:13.5px;margin-top:6px}
  .note{color:var(--dim);font-size:13.5px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .qr{display:none;text-align:center;margin-top:28px}
  .qr img{width:220px;height:220px;border-radius:16px;background:#fff;padding:8px}
  .qr p{color:var(--dim);font-size:14px;margin-top:8px}
  @media (min-width:720px){.qr{display:block}}
  .ios-first .android{order:2}
  .order{display:flex;flex-direction:column}
</style>
</head>
<body>
<main>
  <a class="wordmark" href="/">swish</a>
  <h1>1분이면 시작해요</h1>
  <p class="sub">오늘 뛴 농구를 기록하고, 코트를 찾고, 같이 뛸 사람을 모아요.</p>

  <div class="qr" aria-hidden="true">
    <img src="qr.svg" alt="">
    <p>휴대폰 카메라로 찍으면 이 페이지가 열려요</p>
  </div>

  <div class="order" id="order">
    <section class="card android" aria-labelledby="android-title">
      <h2 id="android-title">Android</h2>
      <div class="step">
        <span class="num">1</span>
        <div class="step-body">
          <a class="btn" href="https://groups.google.com/g/swish_demo" target="_blank" rel="noopener">테스터 그룹 참여하기</a>
          <p class="hint">열리는 화면에서 "그룹 가입"을 눌러 주세요. Play 스토어와 같은 Google 계정이어야 해요.</p>
        </div>
      </div>
      <div class="step">
        <span class="num">2</span>
        <div class="step-body">
          <a class="btn" href="https://play.google.com/apps/testing/kr.swish.app" target="_blank" rel="noopener">테스터 되기</a>
          <p class="hint">"테스터 되기"를 누르면 준비 끝이에요.</p>
        </div>
      </div>
      <div class="step">
        <span class="num">3</span>
        <div class="step-body">
          <a class="btn" href="https://play.google.com/store/apps/details?id=kr.swish.app" target="_blank" rel="noopener">Play 스토어에서 설치</a>
          <p class="hint">앱이 안 보이면 몇 분 뒤 다시 열어 주세요.</p>
        </div>
      </div>
      <p class="note">정식 출시 후에도 다시 설치할 필요 없이 그대로 업데이트돼요.</p>
    </section>

    <section class="card ios" aria-labelledby="ios-title">
      <h2 id="ios-title">iPhone</h2>
      <a class="btn" href="https://apps.apple.com/kr/app/id6767571900">App Store에서 받기</a>
    </section>
  </div>
</main>
<script>
  // iPhone 이면 iPhone 안내를 위로. 그 외(Android·PC)는 Android 먼저.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) document.getElementById("order").classList.add("ios-first");
</script>
</body>
</html>
