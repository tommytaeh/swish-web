<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swish 설치</title>
<meta name="theme-color" content="#0A0B0F">
<!-- Android QR 전용: 찍으면 바로 Play 스토어 앱 페이지로. iPhone 으로 열면 App Store 로. -->
<script>
  location.replace(/iPhone|iPad|iPod/i.test(navigator.userAgent)
    ? "https://apps.apple.com/kr/app/id6767571900"
    : "https://play.google.com/store/apps/details?id=kr.swish.app");
</script>
<style>
  body{background:#0A0B0F;color:#F2F4F8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;padding:48px 16px;text-align:center}
  a{display:inline-block;margin-top:16px;background:#FF3D2E;color:#fff;font-weight:800;padding:14px 24px;border-radius:14px;text-decoration:none}
</style>
</head>
<body>
  <p>Play 스토어로 이동하고 있어요.</p>
  <a href="https://play.google.com/store/apps/details?id=kr.swish.app">Play 스토어에서 받기</a>
</body>
</html>
